name: Deploy Prod

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/i-kiot/ikiot-be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod-${{ github.sha }}
            ${{ env.IMAGE }}:prod-latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app || exit 1
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull nestjs || exit 1
            # No automatic migrate on prod yet: run `prisma migrate deploy` by hand, after a dry run on a copy
            # of the prod database. If that was skipped, the readiness wait below fails this job.
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps nestjs || exit 1
            # Readiness, not liveness: 200 only once the DB answers and holds every migration this image ships.
            for i in $(seq 1 12); do
              curl -fsS https://api.ikiot.io.vn/health/ready && break
              [ "$i" -eq 12 ] && exit 1
              sleep 5
            done
            # The image tag just moved, so the previous one is dangling; without this the disk filled up (2026-10-07).
            docker image prune -f
